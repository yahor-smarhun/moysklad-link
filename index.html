<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Открыть МойСклад</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1b2333; --muted: #6b7486;
    --accent: #2855af; --accent-text: #ffffff; --border: #dde2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141c; --card: #1a202b; --text: #e8ecf3; --muted: #9aa3b5;
      --accent: #4c7de0; --accent-text: #ffffff; --border: #2a3242;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 24px; text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn {
    display: block; padding: 16px; border-radius: 14px; text-decoration: none;
    font-weight: 600; font-size: 18px; margin-bottom: 12px;
  }
  a.primary { background: var(--accent); color: var(--accent-text); }
  a.secondary { border: 1px solid var(--border); color: var(--accent); font-size: 16px; }
  small { color: var(--muted); display: block; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>МойСклад</h1>
  <p>Нажмите кнопку, чтобы открыть приложение на iPhone.</p>
  <a id="open" class="btn primary" href="moysklad://">Открыть МойСклад</a>
  <a id="store" class="btn secondary" href="https://apps.apple.com/ru/app/id6764022162">Скачать в App Store</a>
  <small id="hint"></small>
</main>
<script>
  // Схему можно переопределить: ?scheme=другаясхема://
  var APP_STORE = "https://apps.apple.com/ru/app/id6764022162";
  var params = new URLSearchParams(location.search);
  var scheme = params.get("scheme") || "moysklad://";
  var openBtn = document.getElementById("open");
  var hint = document.getElementById("hint");
  openBtn.href = scheme;

  openBtn.addEventListener("click", function (e) {
    e.preventDefault();
    var start = Date.now();
    var timer = setTimeout(function () {
      // Если страница всё ещё видна, приложение не открылось
      if (!document.hidden && Date.now() - start < 2500) {
        hint.textContent = "Приложение не открылось — открываем App Store.";
        location.href = APP_STORE;
      }
    }, 1500);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) clearTimeout(timer);
    }, { once: true });
    location.href = scheme;
  });
</script>
</body>
</html>
